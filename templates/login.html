{% extends 'base.html' %}

{% block content %}
    <h2 class="loginheader">{{ _('nav_login') }}</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form method="POST">
        <table align="center">
            <tr class="reglog-box">
                <td align="right"><label>{{ _('login_username_email_label') }}</label></td>
                <td align="left"><input type="text" name="login" required></td>
            </tr>
            <tr class="reglog-box">
                <td align="right"><label>{{ _('auth_password_label') }}</label></td>
                <td align="left"><input type="password" name="password" required></td>
            </tr>
        </table>
    </form>
    <center>
        <button style="display: block;margin: 1em;" type="submit">{{ _('nav_login') }}</button><a href="{{ url_for('main.register') }}">{{ _('login_register_link') }}</a>
    </center>

{% endblock %}
