{% extends 'base.html' %}

{% block content %}
    <h2 class="loginheader">{{ _('register_heading') }}</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form method="POST">
        <table align="center">
            <tr class="reglog-box">
                <td align="right"><label>{{ _('register_username_label') }}</label></td>
                <td align="left"><input type="text" name="username" required /></td>
            </tr>
            <tr class="reglog-box">
                <td align="right"><label>{{ _('register_email_label') }}</label></td>
                <td align="left"><input type="email" name="email" required /></td>
            </tr>
            <tr class="reglog-box">
                <td align="right"><label>{{ _('auth_password_label') }}</label></td>
                <td align="left"><input type="password" name="password" required /></td>
            </tr>
        </table>
    </form>

    
    <center>
        <button style="display: block;margin: 1em;" type="submit">{{ _('register_heading') }}</button><a href="{{ url_for('main.login') }}">{{ _('register_login_link') }}</a>
    </center>

{% endblock %}
